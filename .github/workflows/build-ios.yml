name: Build Norte (iOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compile and package unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild -project Norte.xcodeproj -target Norte -configuration Debug \
            -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build-sim" build

      - name: Build unsigned device app (Release)
        run: |
          set -o pipefail
          xcodebuild -project Norte.xcodeproj -target Norte -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Norte.app Payload/
          zip -qr Norte-unsigned.ipa Payload
          ls -la Norte-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Norte-unsigned-ipa
          path: Norte-unsigned.ipa
          retention-days: 30
